spring.application.name=demo

# ---- Server ----
server.port=8080

# ---- Datasource: PostgreSQL su istanza locale ----
spring.datasource.url=jdbc:postgresql://localhost:5432/U5W4D4
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# In produzione va letta da variabile d'ambiente, non scritta nel file.
app.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-lunga-almeno-32-caratteri-non-usare-in-produzione}
app.jwt.durata-minuti=60

# Autenticazione solo via JWT: spegne l'utente in memoria generato da Spring Boot
# (quello della riga "Using generated security password" all'avvio).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
